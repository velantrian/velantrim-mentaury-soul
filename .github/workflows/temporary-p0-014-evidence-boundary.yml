name: Temporary P0-014 evidence boundary

on:
  push:
    branches:
      - agent/p0-014-minimal-belief-lifecycle
    paths:
      - .github/workflows/temporary-p0-014-evidence-boundary.yml
      - scripts/temporary_harden_p0_014_evidence_boundary.py

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-014-minimal-belief-lifecycle
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply Evidence Gate boundary hardening
        run: python scripts/temporary_harden_p0_014_evidence_boundary.py

      - name: Install locked toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Validate complete repository
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Commit tested tree without temporary files
        run: |
          rm scripts/temporary_harden_p0_014_evidence_boundary.py
          rm .github/workflows/temporary-p0-014-evidence-boundary.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mentaury/beliefs/contracts.py \
                  src/mentaury/beliefs/schemas.py \
                  src/mentaury/beliefs/lifecycle.py \
                  src/mentaury/beliefs/reducer.py \
                  tests/test_belief_lifecycle.py \
                  docs/P0_014_MINIMAL_BELIEF_LIFECYCLE.md \
                  scripts/temporary_harden_p0_014_evidence_boundary.py \
                  .github/workflows/temporary-p0-014-evidence-boundary.yml
          git commit -m 'fix(p0-014): reserve supported status for Evidence Gate'
          git push origin HEAD:agent/p0-014-minimal-belief-lifecycle
