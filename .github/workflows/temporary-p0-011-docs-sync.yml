name: Temporary P0-011 docs sync

on:
  push:
    branches:
      - docs/p0-011-post-merge-sync
    paths:
      - .github/workflows/temporary-p0-011-docs-sync.yml
      - scripts/temporary_sync_p0_011_status.py

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-011-post-merge-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply factual status sync
        run: python scripts/temporary_sync_p0_011_status.py

      - name: Install reproducible toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Validate synchronized repository
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Commit docs-only result and remove temporary files
        run: |
          rm scripts/temporary_sync_p0_011_status.py
          rm .github/workflows/temporary-p0-011-docs-sync.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md docs/CURRENT_STATUS.md docs/P0_011_ADVERSARIAL_INTEGRITY_SUITE.md \
                  scripts/temporary_sync_p0_011_status.py \
                  .github/workflows/temporary-p0-011-docs-sync.yml
          git commit -m 'docs(status): record merged P0-011 milestone'
          git push origin HEAD:docs/p0-011-post-merge-sync
