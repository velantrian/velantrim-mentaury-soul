name: One-time contextual cognition status sync

on:
  push:
    branches:
      - agent/post-merge-contextual-cognition-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status-sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/post-merge-contextual-cognition-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
          check-latest: false

      - name: Install locked development toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Apply post-merge documentation synchronization
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              text = read(path)
              found = text.count(old)
              if found != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} occurrence(s), found {found}: {old!r}'
                  )
              write(path, text.replace(old, new, expected))

          # README: research side-track is adopted docs-only after PR #36.
          replace(
              'README.md',
              'CONTEXTUAL_COGNITION_RESEARCH_SIDE_TRACK_DRAFT_PENDING_REVIEW',
              'CONTEXTUAL_COGNITION_RESEARCH_SIDE_TRACK_ADOPTED_DOCS_ONLY_NOT_IMPLEMENTED',
          )
          replace(
              'README.md',
              '│   └── Contextual Cognition & Epistemic Context 🟡 DRAFT · PENDING INDEPENDENT REVIEW\n'
              '│       (distributed into Character / Identity / Genesis Heritage)',
              '│   └── Contextual Cognition & Epistemic Context ✅ ADOPTED · DOCS_ONLY · NOT IMPLEMENTED\n'
              '│       PR #36 merged · independent review round 2 PASS · no execution priority',
          )

          # Quick Reference: replace pre-merge snapshot with accepted docs-only state.
          replace(
              'docs/MENTAURY_QUICK_REFERENCE.md',
              'CONTEXTUAL_COGNITION_RESEARCH_SIDE_TRACK_DRAFT_PENDING_REVIEW',
              'CONTEXTUAL_COGNITION_RESEARCH_SIDE_TRACK_ADOPTED_DOCS_ONLY_NOT_IMPLEMENTED',
          )
          replace(
              'docs/MENTAURY_QUICK_REFERENCE.md',
              '**Research side-track** (не execution roadmap, не второй milestone):\n\n'
              '```text\n'
              'Contextual Cognition & Epistemic Context — PR #36, DRAFT\n'
              'Contracts:  Communication Adaptation, Cognitive Requirement Profile,\n'
              '            Institutional Epistemic Context\n'
              'Status:     DRAFTED · PENDING INDEPENDENT RE-REVIEW · NOT MERGED\n'
              'Owners:     Character Spec §6.4 · Identity Continuity §20 ·\n'
              '            Genesis Heritage §21 Appendix A\n'
              'next:       independent review round 2; no runtime, no P1-001 change\n'
              '```',
              '**Research side-track** (не execution roadmap, не второй milestone):\n\n'
              '```text\n'
              'Contextual Cognition & Epistemic Context — PR #36 MERGED\n'
              'Contracts:  Communication Adaptation, Cognitive Requirement Profile,\n'
              '            Institutional Epistemic Context\n'
              'Status:     ADOPTED · DOCS_ONLY · NOT IMPLEMENTED\n'
              'Review:     round 2 PASS · owner accepted\n'
              'Merge:      850cfe439c3bedd6a2bd4e806e9912283ed5be32\n'
              'Main CI:    31179202276 · 277 passed\n'
              'Owners:     Character Spec §6.4 · Identity Continuity §20 ·\n'
              '            Genesis Heritage §21 Appendix A\n'
              'Boundary:   no runtime authority; P1-001 priority unchanged\n'
              '```',
          )

          # Owning documents: remove stale pending-review language.
          replace(
              'docs/MENTAURY_CHARACTER_AND_PRESENCE_SPEC_V0.1.md',
              '> **2026-08-07:** предварительно распределено по результатам\n'
              '> implementation review из integration note\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](research/MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md);\n'
              '> окончательное принятие ожидает independent review.',
              '> **2026-08-07:** контракт распределён в owning-документ и принят по итогам\n'
              '> independent review round 2 и merge PR #36. Decision record:\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](research/MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md).',
          )
          replace(
              'docs/research/MENTAURY_IDENTITY_CONTINUITY_AND_RELATIONAL_ARCHITECTURE_NOTES.md',
              '> **2026-08-07:** предварительно распределено по результатам\n'
              '> implementation review из integration note\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md);\n'
              '> окончательное принятие ожидает independent review.',
              '> **2026-08-07:** контракт распределён в owning-документ и принят по итогам\n'
              '> independent review round 2 и merge PR #36. Decision record:\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md).',
          )
          replace(
              'docs/research/GENESIS_HERITAGE_INTERPRETATION_AND_HUMAN_ATLAS_NOTES.md',
              '> **2026-08-07:** предварительно распределено по результатам implementation\n'
              '> review из integration note\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md);\n'
              '> окончательное принятие ожидает independent review.',
              '> **2026-08-07:** контракт распределён в owning-документ и принят по итогам\n'
              '> independent review round 2 и merge PR #36. Decision record:\n'
              '> [`MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md`](MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md).',
          )

          # Decision Record: record review PASS, owner acceptance and merge.
          decision = 'docs/research/MENTAURY_CONTEXTUAL_COGNITION_AND_EPISTEMIC_CONTEXT_NOTES.md'
          replace(decision, 'Версия:                       0.4', 'Версия:                       0.5')
          replace(
              decision,
              '| Contextual Communication Adaptation | [`MENTAURY_CHARACTER_AND_PRESENCE_SPEC_V0.1.md`](../MENTAURY_CHARACTER_AND_PRESENCE_SPEC_V0.1.md) §6.4, §10 (CCA-SC-001…007), §11 (MT-CCA-001…002) | DRAFTED | CHANGES_ADDRESSED / PENDING RE-REVIEW | NOT AUTHORIZED |',
              '| Contextual Communication Adaptation | [`MENTAURY_CHARACTER_AND_PRESENCE_SPEC_V0.1.md`](../MENTAURY_CHARACTER_AND_PRESENCE_SPEC_V0.1.md) §6.4, §10 (CCA-SC-001…007), §11 (MT-CCA-001…002) | ADOPTED · DOCS_ONLY | REVIEWED · OWNER ACCEPTED · MERGED | NOT AUTHORIZED |',
          )
          replace(
              decision,
              '| Cognitive Requirement Profile | [`MENTAURY_IDENTITY_CONTINUITY_AND_RELATIONAL_ARCHITECTURE_NOTES.md`](MENTAURY_IDENTITY_CONTINUITY_AND_RELATIONAL_ARCHITECTURE_NOTES.md) §20, §16.9 (CRP-SC-001…008) | DRAFTED | CHANGES_ADDRESSED / PENDING RE-REVIEW | NOT AUTHORIZED |',
              '| Cognitive Requirement Profile | [`MENTAURY_IDENTITY_CONTINUITY_AND_RELATIONAL_ARCHITECTURE_NOTES.md`](MENTAURY_IDENTITY_CONTINUITY_AND_RELATIONAL_ARCHITECTURE_NOTES.md) §20, §16.9 (CRP-SC-001…008) | ADOPTED · DOCS_ONLY | REVIEWED · OWNER ACCEPTED · MERGED | NOT AUTHORIZED |',
          )
          replace(
              decision,
              '| Institutional Epistemic Context | [`GENESIS_HERITAGE_INTERPRETATION_AND_HUMAN_ATLAS_NOTES.md`](GENESIS_HERITAGE_INTERPRETATION_AND_HUMAN_ATLAS_NOTES.md) §21 Appendix A (IEC-SC-001…009, MT-IEC-001…003) | DRAFTED | CHANGES_ADDRESSED / PENDING RE-REVIEW | NOT AUTHORIZED |',
              '| Institutional Epistemic Context | [`GENESIS_HERITAGE_INTERPRETATION_AND_HUMAN_ATLAS_NOTES.md`](GENESIS_HERITAGE_INTERPRETATION_AND_HUMAN_ATLAS_NOTES.md) §21 Appendix A (IEC-SC-001…009, MT-IEC-001…003) | ADOPTED · DOCS_ONLY | REVIEWED · OWNER ACCEPTED · MERGED | NOT AUTHORIZED |',
          )
          replace(
              decision,
              'Статус становится `REVIEWED · READY_FOR_OWNER_ACCEPTANCE` только после\n'
              'успешного повторного independent review, и `ADOPTED` — только после\n'
              'merge PR #36 в `main`. До тех пор он остаётся `DRAFTED`.',
              'Independent review round 2 завершён без архитектурных блокеров.\n'
              'Owner принял изменения merge PR #36; три контракта имеют статус\n'
              '`ADOPTED · DOCS_ONLY · NOT IMPLEMENTED`. Это не authorizes runtime.',
          )
          replace(
              decision,
              'Review round 2: PENDING (this document reflects the state after fixes,\n'
              '                 before re-review)',
              'Review round 2: PASS · review 4882842702 · exact head 2c38fd78da8d\n'
              'Owner acceptance: merge PR #36\n'
              'Merge commit:    850cfe439c3bedd6a2bd4e806e9912283ed5be32\n'
              'Main CI:         31179202276 · success · 277 passed',
          )
          replace(
              decision,
              'PR остаётся **draft** и **не смержен**.',
              'PR #36 **смержен** в `main`; merge commit `850cfe439c3bedd6a2bd4e806e9912283ed5be32`.',
          )
          replace(
              decision,
              'Notion **не синхронизируется** как current architecture до merge PR #36 и\n'
              'успешного independent review.',
              'После успешного independent review и merge PR #36 Notion должен быть\n'
              'синхронизирован из authoritative GitHub `main` после post-merge status sync.',
          )
          replace(
              decision,
              '→ PR #36 remains DRAFT, not merged, Notion not synchronized',
              '→ PR #36 MERGED · docs-only contracts adopted · Notion sync authorized after status sync',
          )

          # Current Status: preserve implementation head, add documentation head and adoption receipt.
          status = 'docs/CURRENT_STATUS.md'
          replace(
              status,
              'Verified implementation head:  0e29c9ebc9c9f2ab9a228a32899e9db8021923c1',
              'Verified implementation head:  0e29c9ebc9c9f2ab9a228a32899e9db8021923c1\n'
              'Authoritative documentation head: 850cfe439c3bedd6a2bd4e806e9912283ed5be32',
          )
          replace(
              status,
              'POST_P0_OWNER_PATH_MERGED_PR_34\nPERMANENT_GITHUB_ACTIONS_PRESENT_AND_VALIDATED',
              'POST_P0_OWNER_PATH_MERGED_PR_34\n'
              'CONTEXTUAL_COGNITION_RESEARCH_SIDE_TRACK_ADOPTED_DOCS_ONLY_NOT_IMPLEMENTED\n'
              'CONTEXTUAL_COGNITION_PR_36_MERGED\n'
              'CONTEXTUAL_COGNITION_REVIEW_ROUND_2_PASS\n'
              'CONTEXTUAL_COGNITION_MAIN_CI_31179202276_PASS_277_TESTS\n'
              'PERMANENT_GITHUB_ACTIONS_PRESENT_AND_VALIDATED',
          )
          replace(
              status,
              '---\n\n# ✅ Реализовано в `main`',
              '---\n\n'
              '# 🧭 Contextual Cognition & Epistemic Context — принятый docs-only research track\n\n'
              '```text\n'
              'PR:             #36 · MERGED\n'
              'Source head:    2c38fd78da8dd06a8baa468b6ae4387279644214\n'
              'Review round 2: PASS · review 4882842702\n'
              'Merge commit:   850cfe439c3bedd6a2bd4e806e9912283ed5be32\n'
              'Main CI:        31179202276 · success · 277 passed\n'
              'Status:         ADOPTED · DOCS_ONLY · NOT IMPLEMENTED\n'
              'Runtime:        NOT AUTHORIZED\n'
              'P1-001:         PRIORITY UNCHANGED\n'
              '```\n\n'
              'Owning contracts:\n\n'
              '- Contextual Communication Adaptation → Character & Presence §6.4;\n'
              '- Cognitive Requirement Profile → Identity Continuity §20;\n'
              '- Institutional Epistemic Context → Genesis Heritage §21 Appendix A.\n\n'
              '```text\n'
              'Docs adopted ≠ runtime implemented\n'
              'Research presence ≠ roadmap priority\n'
              'Tool planning ≠ tool authorization ≠ tool execution\n'
              '```\n\n'
              '---\n\n# ✅ Реализовано в `main`',
          )

          # Project history: append a durable provenance record.
          history = 'docs/PROJECT_HISTORY.md'
          history_text = read(history)
          history_marker = '## 2026-08-07 — PR #36 Contextual Cognition contracts adopted'
          if history_marker not in history_text:
              history_text = history_text.rstrip() + (
                  '\n\n---\n\n'
                  + history_marker
                  + '\n\n'
                  'PR #36 integrated three bounded docs-only research contracts into their owning documents:\n\n'
                  '- Contextual Communication Adaptation → Character & Presence;\n'
                  '- Cognitive Requirement Profile → Identity Continuity;\n'
                  '- Institutional Epistemic Context → Genesis Heritage.\n\n'
                  'Independent review round 1 found unsafe tool-ordering, duplicated normative definitions, duplicate IDs, status drift and unnecessary section renumbering. The branch was corrected so that capability/scope/privacy checks precede authorized execution, the integration note became a Decision Record, IDs have one normative owner, and P1-001 remains the first execution milestone.\n\n'
                  '```text\n'
                  'Review round 2: PASS · 4882842702\n'
                  'Source head:    2c38fd78da8dd06a8baa468b6ae4387279644214\n'
                  'Merge commit:   850cfe439c3bedd6a2bd4e806e9912283ed5be32\n'
                  'Main CI:        31179202276 · 277 passed\n'
                  'Status:         ADOPTED · DOCS_ONLY · NOT IMPLEMENTED\n'
                  '```\n\n'
                  'No runtime, Canon, M3, capability resolver or Action Gate authority was added.\n'
              )
              write(history, history_text)

          PY

          rm .github/workflows/post_merge_contextual_sync.yml

      - name: Validate synchronized repository state
        run: |
          python scripts/validate.py
          python scripts/check_doc_freshness.py
          python -m pytest
          python -m compileall -q src tests scripts
          git diff --check

      - name: Commit and push synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/post_merge_contextual_sync.yml
          git commit -m "docs: synchronize contextual cognition post-merge status"
          git push origin HEAD:agent/post-merge-contextual-cognition-sync
