name: Temporary P0-011 request binding

on:
  push:
    branches:
      - agent/p0-011-adversarial-integrity-suite
    paths:
      - .github/workflows/temporary-p0-011-request-binding.yml
      - scripts/temporary_harden_p0_011_receipt_binding.py

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-011-adversarial-integrity-suite
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply request-binding hardening
        run: python scripts/temporary_harden_p0_011_receipt_binding.py

      - name: Install reproducible toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Validate full repository
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Commit tested tree without temporary files
        run: |
          rm scripts/temporary_harden_p0_011_receipt_binding.py
          rm .github/workflows/temporary-p0-011-request-binding.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mentaury/storage/idempotency.py \
                  tests/test_adversarial_integrity_suite.py \
                  docs/P0_011_ADVERSARIAL_INTEGRITY_SUITE.md \
                  scripts/temporary_harden_p0_011_receipt_binding.py \
                  .github/workflows/temporary-p0-011-request-binding.yml
          git commit -m 'fix(p0-011): bind stored receipts to requests'
          git push origin HEAD:agent/p0-011-adversarial-integrity-suite
