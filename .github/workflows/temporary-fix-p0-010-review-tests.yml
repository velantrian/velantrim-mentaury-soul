name: Temporary fix P0-010 review tests

on:
  push:
    branches:
      - claude/p0-redaction-integrity-kdaps9

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, 'review-tests-patched') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/p0-redaction-integrity-kdaps9
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_redaction.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    TargetEventNotFoundError,\n    VerificationBudget,": "    TargetEventNotFoundError,\n    TargetPayloadMissingError,\n    VerificationBudget,",
              "        assert store.list_stream(\"stream:A\") == store.list_stream(\"stream:A\")\n        assert len(store.list_stream(\"stream:A\")) == 1": "        stream_a = store.list_stream(\"stream:A\")\n        assert [event.event_id for event in stream_a] == [\"EVT-1\"]\n        assert store.list_stream(\"stream:B\") == []",
              "        with pytest.raises(Exception, match=\"already absent\"):": "        with pytest.raises(TargetPayloadMissingError, match=\"already absent\"):",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one occurrence: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts
      - name: Commit tested corrections
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_redaction.py
          git commit -m "test(redaction): tighten rejected-path assertions [review-tests-patched]"
          git push origin HEAD:claude/p0-redaction-integrity-kdaps9
