name: Temporary P0-010 post-merge sync

on:
  push:
    branches:
      - docs/p0-010-post-merge-sync

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, 'p0-010-status-synced') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p0-010-post-merge-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Synchronize status documents
        run: python scripts/temporary_p0_010_status_sync.py
      - name: Validate repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts
      - name: Commit tested status sync
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/CURRENT_STATUS.md
          git commit -m "docs(status): record merged P0-010 [p0-010-status-synced]"
          git push origin HEAD:docs/p0-010-post-merge-sync
