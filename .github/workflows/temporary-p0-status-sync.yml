name: Temporary P0 status sync

on:
  push:
    branches:
      - docs/p0-014-p0-015-status-sync

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/p0-014-p0-015-status-sync
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply authoritative status sync
        run: python scripts/temporary_sync_p0_status.py
      - name: Install locked toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Validate synchronized repository
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts
      - name: Commit documentation without temporary files
        run: |
          rm scripts/temporary_sync_p0_status.py
          rm .github/workflows/temporary-p0-status-sync.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- README.md docs/CURRENT_STATUS.md docs/P0_014_MINIMAL_BELIEF_LIFECYCLE.md docs/P0_015_EVIDENCE_GATE.md scripts/temporary_sync_p0_status.py .github/workflows/temporary-p0-status-sync.yml
          git commit -m 'docs(status): record completed P0-014 and P0-015 milestones'
          git push origin HEAD:docs/p0-014-p0-015-status-sync
