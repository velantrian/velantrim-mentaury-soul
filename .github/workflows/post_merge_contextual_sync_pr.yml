name: One-time contextual cognition sync from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/post-merge-contextual-cognition-sync'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out status-sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/post-merge-contextual-cognition-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
          check-latest: false

      - name: Install locked development toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Execute embedded synchronization script
        shell: bash
        run: |
          python - <<'RUNPY'
          from pathlib import Path

          workflow = Path('.github/workflows/post_merge_contextual_sync.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n          rm .github/workflows/post_merge_contextual_sync.yml"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('embedded synchronization script markers not found')
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          exec(compile(code, str(workflow), 'exec'), {'__name__': '__main__'})
          RUNPY

          rm .github/workflows/post_merge_contextual_sync.yml
          rm .github/workflows/post_merge_contextual_sync_pr.yml
          rm docs/research/POST_MERGE_SYNC_PR_BODY.md
          rm docs/research/POST_MERGE_SYNC_INSTRUCTIONS.md

      - name: Validate synchronized repository state
        run: |
          python scripts/validate.py
          python scripts/check_doc_freshness.py
          python -m pytest
          python -m compileall -q src tests scripts
          git diff --check

      - name: Commit and push synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows
          git commit -m "docs: synchronize contextual cognition post-merge status"
          git push origin HEAD:agent/post-merge-contextual-cognition-sync
