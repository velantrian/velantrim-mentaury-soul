name: Temporary P0-011 validation

on:
  push:
    branches:
      - agent/p0-011-adversarial-integrity-suite
    paths:
      - .github/workflows/temporary-p0-011-validation.yml
      - scripts/temporary_apply_p0_011.py

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-011-adversarial-integrity-suite
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply stored-receipt hardening
        run: python scripts/temporary_apply_p0_011.py

      - name: Install reproducible toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Validate structure
        run: python scripts/validate.py

      - name: Run full test suite
        run: python -m pytest

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

      - name: Commit tested P0-011 tree without temporary files
        run: |
          rm scripts/temporary_apply_p0_011.py
          rm .github/workflows/temporary-p0-011-validation.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mentaury/storage/idempotency.py \
                  src/mentaury/storage/__init__.py \
                  tests/test_adversarial_integrity_suite.py \
                  docs/P0_011_ADVERSARIAL_INTEGRITY_SUITE.md \
                  scripts/temporary_apply_p0_011.py \
                  .github/workflows/temporary-p0-011-validation.yml
          git commit -m 'feat(p0-011): add adversarial integrity suite'
          git push origin HEAD:agent/p0-011-adversarial-integrity-suite
