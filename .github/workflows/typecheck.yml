name: Mentaury Type Check

on:
  pull_request:
    paths:
      - 'src/mentaury/claim_belief_binding/**'
      - 'src/mentaury/claims/contracts.py'
      - 'src/mentaury/non_projection/contracts.py'
      - 'src/mentaury/validation/validator.py'
      - 'src/mentaury/epistemic_change/router.py'
      - 'src/mentaury/storage/integrity.py'
      - 'src/mentaury/beliefs/gated_reducer.py'
      - 'src/mentaury/capabilities/lease/resolver.py'
      - 'src/mentaury/evidence/gate.py'
      - 'src/mentaury/privacy/reconciliation/contracts.py'
      - 'tests/typecheck/claim_bound_lifecycle_boundary.py'
      - '.github/workflows/typecheck.yml'
      - 'requirements-typecheck.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentaury-typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-bound-adapter:
    name: Python 3.13 · ClaimBound adapter boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-typecheck.lock
      - name: Install pinned typecheck toolchain
        run: |
          python -m pip install -r requirements-typecheck.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Verify ClaimBound lifecycle adapter boundary
        run: python -m mypy --python-version 3.13 --warn-unused-ignores --show-error-codes --pretty tests/typecheck/claim_bound_lifecycle_boundary.py

  contract-string-narrowing:
    name: Python 3.13 · Focused source typing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-typecheck.lock
      - name: Install pinned typecheck toolchain
        run: |
          python -m pip install -r requirements-typecheck.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Verify repaired source typing boundaries
        run: python -m mypy --python-version 3.13 --follow-imports=skip --warn-unused-ignores --show-error-codes --pretty src/mentaury/claims/contracts.py src/mentaury/non_projection/contracts.py src/mentaury/validation/validator.py src/mentaury/epistemic_change/router.py src/mentaury/storage/integrity.py src/mentaury/beliefs/gated_reducer.py src/mentaury/capabilities/lease/resolver.py src/mentaury/evidence/gate.py src/mentaury/privacy/reconciliation/contracts.py

  package-baseline:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Python 3.13 · mypy baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-typecheck.lock
      - name: Install pinned typecheck toolchain
        run: |
          python -m pip install -r requirements-typecheck.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Type-check package baseline
        run: python -m mypy --python-version 3.13 --show-error-codes --pretty src/mentaury
