name: Temporary P0-013 finalize

on:
  push:
    branches:
      - agent/p0-013-r1-deterministic-replay
    paths:
      - .github/workflows/temporary-p0-013-finalize.yml
      - scripts/temporary_finalize_p0_013_contracts.py

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-013-r1-deterministic-replay
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Apply final contract cleanup
        run: python scripts/temporary_finalize_p0_013_contracts.py

      - name: Install locked toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Validate complete repository
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Commit tested tree without temporary files
        run: |
          rm scripts/temporary_finalize_p0_013_contracts.py
          rm .github/workflows/temporary-p0-013-finalize.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add src/mentaury/replay/contracts.py \
                  src/mentaury/replay/engine.py \
                  tests/test_r1_replay.py \
                  docs/P0_013_R1_DETERMINISTIC_REPLAY.md \
                  scripts/temporary_finalize_p0_013_contracts.py \
                  .github/workflows/temporary-p0-013-finalize.yml
          git commit -m 'refactor(p0-013): finalize neutral replay contracts'
          git push origin HEAD:agent/p0-013-r1-deterministic-replay
