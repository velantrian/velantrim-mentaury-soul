name: Temporary finalize P0-010 budget guard

on:
  push:
    branches:
      - claude/p0-redaction-integrity-kdaps9

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, 'budget-patched') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/p0-redaction-integrity-kdaps9
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply focused budget guard and regression test
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          integrity_path = Path("src/mentaury/storage/integrity.py")
          integrity = integrity_path.read_text(encoding="utf-8")
          integrity = integrity.replace("import json\nimport sqlite3\n", "import json\n", 1)
          old = "        try:\n            decoded = json.loads(audit_payload.payload_bytes.decode(\"utf-8\"))"
          new = (
              "        try:\n"
              "            self._budget.require_payload_size(len(audit_payload.payload_bytes))\n"
              "        except ResourceBudgetExceeded as exc:\n"
              "            return self._event_budget_fail(target_event, checked, exc)\n"
              "        try:\n"
              "            decoded = json.loads(audit_payload.payload_bytes.decode(\"utf-8\"))"
          )
          if integrity.count(old) != 1:
              raise SystemExit("expected unique audit-payload decode marker")
          integrity_path.write_text(integrity.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_redaction_evidence_linkage.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_r0_applies_payload_budget_before_decoding_linked_audit_payload"
          if marker not in tests:
              tests += base64.b64decode("").decode("utf-8")
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Validate exact patched tree
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Commit tested patch to PR branch
        shell: bash
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add src/mentaury/storage/integrity.py tests/test_redaction_evidence_linkage.py
          git commit -m "fix(integrity): enforce audit payload budget [budget-patched]"
          git push origin HEAD:claude/p0-redaction-integrity-kdaps9
