name: Temporary P0-011 final head

on:
  push:
    branches:
      - agent/p0-011-adversarial-integrity-suite
    paths:
      - .github/workflows/temporary-p0-011-final-head.yml

permissions:
  contents: write

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-011-adversarial-integrity-suite
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install reproducible toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Validate final P0-011 tree
        run: |
          python scripts/validate.py
          python -m pytest
          python -m compileall -q src tests scripts

      - name: Remove temporary workflow from final diff
        run: |
          rm .github/workflows/temporary-p0-011-final-head.yml
          git config user.name 'Velantrim GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/temporary-p0-011-final-head.yml
          git commit -m 'ci(p0-011): remove final validation workflow'
          git push origin HEAD:agent/p0-011-adversarial-integrity-suite
