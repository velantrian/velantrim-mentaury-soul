name: Mentaury CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentaury-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  validate:
    name: Python 3.13 · validator · pytest · compileall
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Validate repository structure
        run: python scripts/validate.py

      - name: Run complete test suite
        run: python -m pytest

      - name: Compile source, tests and scripts
        run: python -m compileall -q src tests scripts
