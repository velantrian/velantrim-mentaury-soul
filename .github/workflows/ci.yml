name: Mentaury CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mentaury-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  validate:
    name: Python 3.13 · validator · pytest · compileall
    runs-on: ubuntu-24.04
    # Applies after a runner is assigned. When GitHub-hosted runners are
    # unavailable (platform outage or queue saturation), jobs can sit in
    # "queued" with runner_id=0 and be cancelled before any step runs.
    timeout-minutes: 30

    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development toolchain
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check

      - name: Validate repository structure
        run: python scripts/validate.py

      - name: Check derived-status documentation freshness
        run: python scripts/check_doc_freshness.py

      - name: Run complete test suite with coverage baseline
        run: python -m pytest --cov=mentaury --cov-report=term-missing --cov-report=xml

      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist

      - name: Verify wheel release contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found: {wheels}"

          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "mentaury/py.typed" in names, "wheel must ship the PEP 561 marker"
              assert any(
                  name.endswith(".dist-info/licenses/LICENSE")
                  or name.endswith(".dist-info/LICENSE")
                  for name in names
              ), "wheel must ship the proprietary license notice"
              assert not any(name.startswith("tests/") for name in names), "tests leaked into wheel"
              assert not any(name.startswith("docs/") for name in names), "docs leaked into wheel"

              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
              assert f"Name: {project['name']}\n" in metadata
              assert f"Version: {project['version']}\n" in metadata
          PY

      - name: Compile source, tests and scripts
        run: python -m compileall -q src tests scripts
